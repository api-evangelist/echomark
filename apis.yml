aid: echomark
name: EchoMark
description: >-
  EchoMark is an information-security company that embeds unique, invisible forensic
  watermarks — different for every recipient — into emails, documents, images, screen
  captures, and file-share links, so that when internal information leaks the exposed
  copy can be traced back to the individual it was released to. Products include EchoMark
  Screen (screenshot/photo watermarking), watermarked email communications with AI
  rephrasing, secure File Share, and Chroma (invisible) and Luma (print-resistant) image
  watermarking. The EchoMark API lets organizations embed forensic watermarking and
  automate leak detection across their own applications and workflows, with API clients
  created self-service in the EchoMark web application.
